# Gated nginx site for Every AI Policy Ever (pilot access via Clerk).
# Everything except /sign-in/ and /_auth/login needs a valid pilot cookie.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Relative redirects, so the browser keeps the host and port it used.
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s;
    set $auth_upstream http://register-auth:8000;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Unauthenticated visitors go to the sign-in page.
    error_page 401 = @signin;
    location @signin { return 302 /sign-in/; }

    # Sign-in page: loads Clerk's SDK from the Clerk instance only.
    location = /sign-in/ {
        root /usr/share/nginx/signin;
        rewrite ^ /index.html break;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://grown-caribou-8529.clerk.accounts.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com https://*.clerk.accounts.dev; connect-src 'self' https://grown-caribou-8529.clerk.accounts.dev https://*.clerk.accounts.dev; font-src 'self' data:; worker-src blob:; frame-src https://*.clerk.accounts.dev; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /sign-in/sign-in.js {
        alias /usr/share/nginx/signin/sign-in.js;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Login: trades a Clerk session token for the pilot cookie. Public, POST only.
    location = /_auth/login {
        limit_except POST { deny all; }
        proxy_pass $auth_upstream/login;
    }

    # Crawler files and the favicon are public (no pilot cookie needed).
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /assets/favicon.svg {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Gate status (on/off only). Public and never cached.
    location = /_auth/gate {
        proxy_pass $auth_upstream/gate;
        add_header Cache-Control "no-store" always;
    }

    # Pilot logout: clears the pilot cookie. Public, so a signed-out visitor can still reach it.
    location = /_auth/logout {
        proxy_pass $auth_upstream/logout;
    }

    # Admin page: any signed-in pilot can load it; the API below checks admin rights.
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        auth_request /_auth/verify;
        root /usr/share/nginx/gate-admin;
        rewrite ^ /admin/index.html break;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }
    location = /admin/admin.js {
        auth_request /_auth/verify;
        root /usr/share/nginx/gate-admin;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Admin API: the verifier checks the cookie and admin rights on every call.
    location = /admin/api/users {
        limit_except GET POST { deny all; }
        proxy_pass $auth_upstream/admin/api/users;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }

    # Internal subrequest used by auth_request on every protected location.
    location = /_auth/verify {
        internal;
        proxy_pass $auth_upstream/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_auth/verify;
        # Gated content must never sit in a shared cache (Cloudflare served cached 200s to anonymous visitors).
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        try_files $uri $uri/ =404;
    }

    location /data/ {
        auth_request /_auth/verify;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/javascript js;
            application/json json;
            text/csv csv;
            application/vnd.sqlite3 sqlite;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        }
    }

    # Archived third-party pages: shown as documents, never allowed to run scripts on this site.
    location /archive/ {
        auth_request /_auth/verify;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        types {
            text/html html htm;
            application/pdf pdf;
            text/plain txt;
            application/json json jsonl;
            application/xml xml;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/octet-stream bin;
        }
        default_type text/plain;
    }

    # Scripts, deployment files and hidden files are not served.
    location ~ ^/(tools|deploy)/ { deny all; }
    location ~ /\. { deny all; }
}
