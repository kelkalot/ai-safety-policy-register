# Rewrites the pinned "Project status" issue (tools/pipeline.py board --sync, AGENTS.md section 7.11) after every
# push to main and every Monday, so the status agents and people read is never older than the last merge.
name: board
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rewrite the Project status issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/pipeline.py board --sync
