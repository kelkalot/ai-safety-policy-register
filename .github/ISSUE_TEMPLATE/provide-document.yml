name: Provide a document
description: A copy of an official document the archiver cannot download, because the site blocks automated downloads.
title: "Document for "
labels: ["document"]
body:
  - type: markdown
    attributes:
      value: |
        Some official sites block automated downloads (by robots.txt, or by refusing the archiver's network). If you downloaded the document yourself, attach it here. A maintainer checks that it matches the official source; the copy is then stored with its SHA-256 and with your GitHub name as the provider, and the next pipeline run reads it. For an instrument the register does not have yet, for example one in an open question, leave the record ID empty and give its title and jurisdiction code instead. Please attach only documents you downloaded from the official URL below, unchanged.

        AI agents and automated tools are welcome under the rules in [CONTRIBUTING.md](https://github.com/kelkalot/every-ai-policy-ever/blob/main/CONTRIBUTING.md): say so under "Submitted by", suggest only what you found on an official page you opened, and never write a decision line.
  - type: input
    id: record
    attributes:
      label: Record ID
      description: The register record the document belongs to. Leave empty for an instrument without a record.
      placeholder: US-CA-12
  - type: input
    id: title
    attributes:
      label: Title
      description: Only for an instrument without a record, as the document gives it.
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction code
      description: Only for an instrument without a record. The ISO code of the country (NO, JP), a sub-national code (US-FL, CA-ON), or a body code (EU, UN).
      placeholder: US-FL
  - type: input
    id: url
    attributes:
      label: Official URL
      description: Where you downloaded it from.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The document
      description: Drag the file (PDF or saved HTML) into this field. GitHub attaches files up to 25 MB.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Downloaded on
      placeholder: YYYY-MM-DD
  - type: dropdown
    id: submitter
    attributes:
      label: Submitted by
      description: AI agents and automated tools say so here (see CONTRIBUTING.md).
      options:
        - a person
        - an AI agent or automated tool, for a person
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or tool
      description: If an agent or tool submitted this, its name and the person or organisation it acts for.
