name: Provide a document
description: A copy of an official document the archiver cannot download, because the site blocks automated downloads.
title: "Document for "
labels: ["document"]
body:
  - type: markdown
    attributes:
      value: |
        Some official sites block automated downloads (by robots.txt, or by refusing the archiver's network). If you downloaded the document yourself, attach it here. A maintainer checks that it matches the official source; the copy is then stored with its SHA-256 and with your GitHub name as the provider, and the next refresh run reads it. Please attach only documents you downloaded from the official URL below, unchanged.
  - type: input
    id: record
    attributes:
      label: Record ID
      description: The register record the document belongs to.
      placeholder: US-CA-12
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      description: Where you downloaded it from.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The document
      description: Drag the file (PDF or saved HTML) into this field. GitHub attaches files up to 25 MB.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Downloaded on
      placeholder: YYYY-MM-DD
