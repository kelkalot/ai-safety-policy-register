# Serve the register on http://localhost:8080
#   docker compose up -d
# Another host port:   REGISTER_PORT=8090 docker compose up -d
# The folder is mounted read-only, so after running tools/archive.py or editing
# data/records.json + tools/build.py, a browser reload shows the new data.
services:
  register:
    image: nginx:1.27.4-alpine
    container_name: ai-safety-policy-register
    ports:
      - "${REGISTER_PORT:-8080}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
